; ── 04d · 防御取消当前动作 / Guard cancels the current action ─────────────
; 单按防御键就取消**当前正在做的动作**，不只是攻击：
;   · 攻击 / 武技        · 喝药、吃药丸
;   · 上阴阳符（阴阳术）   · 上咒术 / 忍术道具
;   · 丢道具 / 使用快捷栏物品
; 换句话说：只要角色在做一个"动作"，单按防御就把它打断并转入防御。
; **组合键不算**：防御 + X/Y/A（等攻击键）是刻意组合（武技输入），不触发取消。
; **移动不影响**：推摇杆/按方向键照样能取消。
; A pure guard press cancels the action currently being performed -- not only
; attacks but also drinking/using items, onmyo talismans, ninjutsu and throwing
; items. Guard + X/Y/A (a martial-skill input) is a combination and must not
; cancel. Movement is never consulted.

; 总开关：1 = 开（默认），0 = 关。
; Master switch: 1 = on (default), 0 = off.
CancelActionOnGuard=1

; 哪些手柄键算"攻击键"（XInput 标准位：A=0x1000 B=0x2000 X=0x4000 Y=0x8000）。
; Which pad buttons count as attacks (standard XInput bits; default A/B/X/Y).
AttackButtonMask=0xF000

; 防御键与攻击键**同时**按下的判定窗口（毫秒）：该窗口内攻击键的按下沿会让本次
; 判定变成组合键，从而不取消。默认 100。
; Window in ms for "pressed together": an attack edge this close to the guard press
; makes it a combination, so nothing is cancelled. Default 100.
ComboGuardWindowMs=100

; 严格模式：1 = 只要攻击键**此刻按着**就不取消。默认 0 —— 攻击键常常还按着
; （刚打完没松手），严格模式会让你最想取消时反而取消不了。
; Strict mode: 1 = any held attack button blocks the cancel. Default 0.
CancelActionStrictHold=0

; 取消时把当前动作的动画帧向前推进多少（越大越"干净地"结束当前动作）。
; How far to advance the current action's motion frame. 30 matches CancelRecovery.
CancelActionFrames=30

; 0 = **任何**防御按下都取消（默认）—— 不区分精防还是普通防御，只要防御键按下
; 就取消当前动作并进入防御。设成非 0 才会要求"这段时间内开始过攻击"才动动画。
; 0 = ANY guard press cancels (default); perfect and normal blocks behave the same.
CancelActionRecentMs=0


; ── 05 · 对敌效果 / Enemy effects ───────────────────────────────────────
; 作用于本次被格挡攻击的"攻击来源"。命中上下文里同时带攻守双方角色指针
; （[ctx+0x100] 与 [ctx+0xE8]），取其中不是玩家的那个作为攻击者。
; Applied to the source of the guarded attack: the hit context carries both
; characters, and the one that is not the player is treated as the attacker.
;
; 数值为固定内部单位，不是百分比。0 = 关闭。
; Fixed internal units, not percentages. 0 = off.

; 削减敌人当前精力（float，[[char+0x240]+0x40]，即 Refer::Stamina 读的字段）。
; Enemy current Ki loss (the same field Refer::Stamina reads).
EnemyKiDamage=0

; 对敌 HP 伤害（整数，[[char+0x240]+0x20]，即 Refer::Hp 读的字段；可致死）。
; Enemy HP damage (the field Refer::Hp reads; can kill).
; 只想削精不想扣血时保持 0。
EnemyHpDamage=0


; ── 06 · 音效 / Sound ───────────────────────────────────────────────────

; 精防提示音：1 = 开启，0 = 关闭。
SoundEnabled=1

; 音量 0～1，允许小数，与游戏音量独立。
SoundVolume=1

; Sounds 目录内的 WAV 文件名，只填文件名不要填路径。
; 支持普通 16 位整数 PCM WAV、44100/48000 Hz、单声道或双声道。
; WAV filename inside Sounds; filename only, no path.
; Standard 16-bit integer PCM WAV, 44100/48000 Hz, mono or stereo.
SoundFile=parry.wav


; ── 07 · 日志 / Logs ────────────────────────────────────────────────────

; 日志快捷键：1 = 开启。游戏在前台时按 Ctrl+Shift+F10 写一行累计统计。
; Log hotkey: with the game foreground, Ctrl+Shift+F10 writes a stats line.
; 日志文件：Nioh1PerfectGuard.gameplay.log（DLL 同目录）。
DiagnosticHotkey=1
