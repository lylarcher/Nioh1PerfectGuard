; ======================================================================
; 仁王 1 · 精准防御 / Nioh 1 · Perfect Guard
; ======================================================================
; 只改等号右边的值，保留参数名；分号开头的行都是说明。
; Edit values after "=" only. Lines beginning with ";" are comments.
;
; 保存为 UTF-8。多数设置支持游戏中保存后自动生效（约 1 秒内）。
; Save as UTF-8. Most settings reload automatically within a second.
;
; 更换 DLL 必须先退出游戏。
; Close the game before replacing the DLL.
;
; 说明：本 MOD 不修改任何游戏代码字节，使用 CPU 硬件断点 +
; 改写线程上下文来实现，因此对完整性校验完全透明。

[PerfectGuard]

; ── 01 · 基本设置 / General ─────────────────────────────────────────────

; MOD 总开关：1 = 开启，0 = 关闭（关闭时不安装任何断点）。
; Master switch: 1 = enabled, 0 = disabled (no breakpoints are armed).
Enabled=1

; 精防窗口（毫秒），范围 1～1000。从"新按下防御键"的边沿起算，按住不刷新。
; 450 = 当前默认（2026-09-28 按使用手感从 250 调宽）。
; Guard window in milliseconds, 1–1000, measured from the fresh guard press (holding
; does not extend it). 450 is the current default (widened from 250 on 2026-09-28).
WindowMs=450

; 精防后提前接续（取消后摇）：1 = 开启，0 = 关闭（默认关闭）。
; ⚠️ 实验性：实现方式是推进角色动画帧（[[char+0x38]+0x60]，引擎的
; Refer::MotionFrame 读的就是它）。未经实机验证，可能与某些动作冲突。
; 只在当前值看起来确实是动画帧（0 ≤ v < 10000）时才写入，否则跳过。
; Cancel guard recovery by advancing the motion frame. EXPERIMENTAL, not yet
; verified in game; off by default. Only writes when the value already looks
; like a motion frame.
CancelRecovery=0

; 取消后摇时向前推进的帧数，0～1000。越大接续越快。
; Frames to advance. Larger = faster follow-up.
CancelRecoveryFrames=30


; ── 02 · 精防判定 / What counts as a perfect guard ──────────────────────
; RequireTimelyGuard=1 时，只有"在 WindowMs 内新按下过防御键"的成功格挡才算精防。
; 0 = 每次成功格挡都按精防处理（调试/体验用）。
; With 1, only a successful block that happens within WindowMs of a fresh guard
; press counts. 0 = every successful block counts (useful for testing).
RequireTimelyGuard=1

; 防御键位掩码（标准 XInput 位）。默认 0x0100 = XInput 的 LEFT_SHOULDER，
; 即手柄 L1 / LB —— 仁王 PC 版默认防御键。
; 常用值：A=0x1000 B=0x2000 X=0x4000 Y=0x8000，LB=0x0100 RB=0x0200，
;         LT=0x0400 RT=0x0800，BACK=0x0020 START=0x0010。
; 若你改过键位，用 MOD 日志里的 "GUARD pressed (buttons=0x....)" 反查实际掩码。
; Guard button mask, standard XInput bits. Default 0x0100 = LEFT_SHOULDER (L1/LB).
GuardButtonMask=0x0100

; 读取哪个手柄槽位（0～3），单手柄保持 0。
; Which controller slot to read, 0–3. Keep 0 for a single controller.
PadSlot=0

; 【键鼠玩家看这里】键盘防御键的虚拟键码（VK），0 = 不启用。
; 手柄掩码与键盘键是"或"的关系，两个都开着也行。
; 常见 VK：Shift=0x10 Ctrl=0x11 空格=0x20 左Shift=0xA0 右Shift=0xA1
;           鼠标左键=0x01 鼠标右键=0x02 鼠标中键=0x04
; 不知道填什么？把下面的 LearnButtons 设成 1，进游戏按下你的防御键，
; 日志里会出现 "LEARN key VK=0x.. pressed -> GuardKeyVK=.."，把那串数字填到这里。
; Keyboard guard key virtual-key code; 0 = disabled. OR'd with the pad mask.
; Unknown value? Set LearnButtons=1, press your guard key in game, then read the
; "LEARN ..." line from the log.
GuardKeyVK=0

; 按键学习模式：1 = 开启。会在日志里报告"新出现的按键位/键码"，
; 用来在不知道键位时反查 GuardButtonMask / GuardKeyVK。
; 只写日志、不改变任何游戏行为；标定完成后建议改回 0。
; Learn mode: logs every newly seen pad bit and key code so the bindings can be
; determined without guessing. Log only, no gameplay effect. Set back to 0 after.
LearnButtons=0

; 精力字段追踪：1 = 开启（当前默认，处于验证阶段）。
; 同时采样两处字段：数值变化时记一行，另加每约 5 秒一次的慢采样。
;   ki     = [[char+0x240]+0x40]   引擎 Refer::Stamina 读的字段
;   entry7 = [[char+0x240]+0xDEC]  格挡扣精实际改的字段
; 用来确定「格挡耗精减免」是否真的作用在你看得见的精力条上。
; 验证完成后可改回 0 让日志更干净。
; Ki field trace. Logs whenever the entry moves, plus a slow periodic sample:
;   ki     = [[char+0x240]+0x40]   what Refer::Stamina reads
;   entry7 = [[char+0x240]+0xDEC]  what the guard cost subtracts from
; This settles whether the cost reduction affects the visible Ki bar.
KiTrace=1

; 诊断开关，默认 0（全部开启）。用于定位崩溃来自哪一部分：
;   1 = 不装任何断点（此时无法检测任何东西）
;   2 = 不启动输入轮询线程
;   4 = 开启已知会弄崩游戏的“滚动重装”（仅供排查，不要常开）
;   8 = 不跑硬件断点自检
; Diagnostic bitmask; 0 = everything on. Use it to attribute a crash to one part.
DiagDisable=0

; 哪个事件代表“玩家格挡成功”。
;   2 = 自动（默认）：先用扣精点；若它一次都没触发、而旗标点已看到 3 次玩家格挡，则自动切探并在日志里说明。
;   0 = 只用扣精点（最精确，且只有它能缩放扣精量）
;   1 = 只用旗标点（触发条件宽松得多，但拿不到扣精量：
;       KiRecoveryMode 1/2 与“扣精点缩放”在此模式下不生效）
; Which event means the player blocked. 2 = auto (default), 0 = guard-cost site,
; 1 = guard-flag site. See the README for the trade-offs.
BlockEventSource=2




; ── 03 · 格挡耗精 / Guard Ki cost ───────────────────────────────────────
; 格挡耗精减免百分比，范围 0～100。100 = 完全免耗精，50 = 只掉一半。
;
; 实现方式（两条一起用）：
;  1) 在格挡扣精调用处把消耗量按比例缩放；
;  2) 在格挡开始时快照"可见精力"（[[char+0x240]+0x40]，即引擎
;     Refer::Stamina 读的字段），随后 400 毫秒内把损失按该百分比补回。
;
; 为什么需要第二条：引擎的可见精力来自一张从 +0x40 开始的 16 项表
; （遍历器 0x7B4CB0），而格挡扣精改的是另一张表的 +0xDEC，
; 两者地址不同，所以只缩放消耗量并不足以保证精力条不掉。
; 补回只会"加"，只补到快照值，且只在一个很短的时间窗内生效。
;
; **重要**：旗标事件源（BlockEventSource=1，或自动切过去的）是在引擎
; 扣完精之后才触发的，所以那里的"快照"必须取扣精**之前**的值，否则
; 损失永远是 0、补回等于没开 —— 这正是 N 网用户反馈的"精力不返还"。
; 见下面的 KiTopUpPreEventMs。
;
; Guard Ki cost reduction, 0–100 (100 = free blocking). Applied two ways, because
; static analysis cannot prove the field the guard-cost anchor writes is the field
; the gauge shows:
;   1. the cost is scaled at the subtraction site (0x74DE51);
;   2. the confirmed Ki field, [[char+0x240]+0x40] -- the one Refer::StaminaRate
;      (0x6EC800) divides by +0x44 to produce a 0..1 ratio for the UI -- is topped
;      back up by this percentage of the loss, over 400 ms after a block.
; The top-up only ever raises Ki, only up to the reference, and never exceeds it.
; A KIV / KIV-FLAG log line then reports which mechanism is actually in effect.
KiDamageReductionPercent=100

; 是否**同时补回**可见精力字段（[[char+0x240]+0x40]）。
; Whether to ALSO top the visible Ki field back up, on top of scaling the cost.
;
;   1 = 补回（默认）。如果缩放锚点够不到精力条，靠这一步才真正省下精力。
;   0 = 不补回，只靠扣精点的缩放。
;       **当日志里的 KIV 行说"缩放已经够到精力条"时，应设成 0** ——
;       否则两条机制都在减，属于重复计算。
;
; 无论取值如何，MOD 都会继续采样并给出 KIV / KIV-FLAG 判定（关掉补回不会
; 失去诊断能力）。
;   1 = top up (default). This is what actually spares Ki when the subtract-site
;       scaling never reaches the bar.
;   0 = never write Ki; rely on the subtract-site scaling alone. Use this when the
;       KIV log line says the scaling already reaches the bar, otherwise the
;       reduction is applied twice.
; Sampling and the KIV / KIV-FLAG verdicts continue either way.
KiTopUp=1

; 补回时用来当"基准"的精力值往前回溯多少毫秒，范围 0～412（样本环约覆盖半秒）。
; How far back (ms) the reference Ki value for the top-up is taken from.
;
; 为什么需要它：旗标事件源在引擎**扣完精之后**才触发（实测：精防那一毫秒
; 日志里已经是 ki=71.03/105，之前是满的 105），所以在事件时刻现读的值里
; 已经含了这次扣除，损失算出来是 0，补回一分钱都不还。MOD 因此让 8ms 的
; 输入线程一直在记录精力样本，事件发生时取"最近 N 毫秒内的最高值"当基准，
; 于是已经发生的扣除也能被算回来。日志里的 `KIREF` 行会打出它取到的值。
;
;   100 = 默认。引擎扣精与旗标在同一帧内，100ms 已留出十余倍余量。
;   0   = 关闭（退回旧行为：旗标源下补回无效）。
;
; 代价（诚实说明）：如果某次与格挡无关的精力消耗恰好落在窗口内，它也会被当成
; 格挡耗精补回。**最可能撞上的正是本 MOD 自己的防御取消打法** —— 先出一刀
; （攻击的耗精在出刀瞬间就扣了）、再按防御取消，如果这两件事相隔不到本窗口，
; 那一刀的精耗会被一起补回。日志里的 `KIREF` 行会打出取到的基准值：若它明显
; 高于你格挡前的实际精力，就是这种情况，把本键调小（例如 50）或设 0。
;
; How far back (ms) the reference Ki value is taken from, 0–412: the sample ring
; covers about half a second, so a longer window cannot be served. The flag event
; source fires *after* the engine charged the Ki, so a reference read at event time
; already contains the charge and the top-up would hand nothing back -- the defect a
; user reported. The 8ms input tick therefore keeps a ring of samples and the
; reference is the highest value seen within this window (`KIREF` reports it).
;   100 = default: the charge and the flag land in the same frame, so this leaves
;         more than ten times the margin.
;   0   = disabled (the old behaviour, where the top-up does nothing here).
; Trade-off: an unrelated spend that lands inside the window is refunded too. The
; likeliest case is this mod's own cancel playstyle -- attack (the cost is charged
; the moment the swing starts), then press guard to cancel it: if the two are closer
; together than this window, that swing's Ki is refunded as well. The `KIREF` line
; prints the reference it adopted, so if it is clearly above your real Ki before the
; block, that is what happened -- lower this key (e.g. 50) or set it to 0.
KiTopUpPreEventMs=100


; ── 04 · 回精 / Ki recovery ─────────────────────────────────────────────
;   0 = 不回精 / no recovery
;   1 = 返还本次格挡消耗掉的精力（安全、有界）/ refund this guard's cost
;   2 = 固定数值 / add FixedRecovery
;   3 = 回复最大精力的 1/6（默认，与仁王2版 Balanced 一致）
;       restore one sixth of maximum Ki
; 最大精力取自引擎自己的 Refer::Stamina 字段域（[[char+0x240]+0x44]）。
KiRecoveryMode=3

; KiRecoveryMode=2 时使用的固定回精量，范围 0～100000。
; Used only by mode 2: 0–100000.
FixedRecovery=50


; ── 04b · 回血 / HP restore ────────────────────────────────────────────
; 精防成功时回复玩家自己的体力（HP）。
; Restores the player's own HP on a successful perfect guard.
;
;   0 = 关闭 / off
;   1 = 按最大 HP 的百分比（默认）/ percent of maximum HP
;   2 = 固定数值 / add HpRestoreFixed
;   3 = 两者相加 / both, added together
; 默认是 1（3%），所以默认每次精防回 3% 体力 —— 想关掉就设 0。
; The default is 1 (3%), so a perfect guard heals 3% by default; set 0 to disable.
;
; 回复量永远不超过上限，HP 已满时不写内存，HP 为 0（已死）时**绝不复活**。
; 字段偏移会先做合理性校验，不像 HP 就拒绝写入并在日志里报警。
; Never exceeds maximum, never writes at full HP, and never revives a dead
; character; the field pair is sanity-gated before any write.
HpRecoveryMode=1

; 每次精防回复最大 HP 的百分比（0～1000，向下取整）。
; HpRecoveryMode=1 或 3 时生效：3% of 880 = 26 HP。
; Percent of maximum HP per perfect guard (0–1000, truncated to whole HP).
; Used by mode 1 and 3.
HpRestorePercent=3

; HpRecoveryMode=2 或 3 时使用的固定回血量（0～100000，向下取整）。
; Used by mode 2 and 3: flat HP per perfect guard.
HpRestoreFixed=50


; ── 04c · 精防后的限时增益 / Timed buffs ────────────────────────────────
; 精防成功后给自己挂一个**有持续时间**的增益；每次精防把计时**刷新**为满时长，
; 数值**不叠加**（4% 就是 4%，连打 10 次精防还是 4%）。
; Grants a timed buff on a perfect guard; each guard refreshes the timer to the
; full duration. Repeated procs never stack the magnitude.
;
; 实现用的是**引擎自己的增益状态对象**（不是硬写数值字段）：
;   移动速度 = AddStateObjectMoveSpeed（状态 ID 0x1B）
;   承受伤害 = AddStateObjectDamageRate（状态 ID 0x1E）
;   霸体     = AddStateObjectArmor（状态 ID 0x33）
; 详见开发笔记 RE_NOTES.md §4.51。
;
; ⚠⚠ 本轮 SpeedBuffPercent 与 DamageCutPercent **默认 0（关闭）**：
;   这两个增益是本 MOD 唯一"调用游戏代码"的功能，而那次调用**至今没有在任何地方跑过一次**
;   （本机游戏进程无法关闭/无法结束，吸引模式实验没能做成）。
;   构造函数经由**进程级全局管理器**分配、并往**游戏线程正在遍历的容器**里插入；
;   那个分配器能否被第二个线程安全使用**尚未证实**，而失败形态是**静默的堆损坏**，
;   不是干脆崩溃。所以它保持关闭，直到至少被看见工作过一次。
;   想启用：把下面两个百分比改成 4（或你要的数值）—— 这就是全部开关。
; ⚠⚠ SpeedBuffPercent and DamageCutPercent ship as 0 (off) this round for the same
;   reason: calling game code has never been executed anywhere yet, the allocator's
;   thread-safety is unproven, and the failure mode would be silent heap corruption.
;   Set the percentage to 4 to opt in.

; 移动速度提升百分比（0 = 关闭；上限 1000）。
; Move speed +N% (0 = off, max 1000).
SpeedBuffPercent=0

; 移动速度增益持续毫秒数（0 = 关闭）。
; Duration in ms (0 = off).
SpeedBuffMs=10000

; 承受伤害降低百分比（0 = 关闭；上限 100）。4 表示受到的伤害变成 96%。
; Damage taken -N% (0 = off, max 100). 4 means incoming damage x0.96.
DamageCutPercent=0

; 承受伤害降低的持续毫秒数（0 = 关闭）。
; Duration in ms (0 = off).
DamageCutMs=10000

; 霸体：1 = 开，0 = 关（默认关）。开着时被打**不产生硬直**，
; 但**照常扣体力与精力**，被敌人**投技**打到仍然会进投技动画。
; Armour: 1 = on, 0 = off (default off). While active you are not staggered by
; hits, but you still lose HP/Ki, and enemy grabs still play their animation.
ArmorBuff=0

; 霸体持续毫秒数（仅在 ArmorBuff=1 时生效）。
; Armour duration in ms (only used when ArmorBuff=1).
ArmorBuffMs=5000

; 注：以上三个限时增益**已被用户决定不使用**（可能与以后的 buff 冲突），默认全关。
; 注意"移除"那条路实测会崩（见 CHANGELOG 2.0e），现已改为把时长交给引擎、
; MOD 不再手工移除；即便如此也**不建议**打开。
; NOTE: the three timed buffs above were dropped by user decision (possible conflict
; with future buffs). They ship off and are no longer developed.


; ── 06 · 九十九槽（精华量表 / 守护灵槽）/ 99 gauge ─────────────────────
; 两项功能，**默认都开**，各 10%：
;   * 不在九十九状态 → **攒槽**：把量表加 N%（`LivingWeaponGaugePercent`）
;   * 在九十九状态（烧条 > 0）→ **续烧条**：把烧条加 N 个百分点（`LivingWeaponExtendPercent`）
;
; 实测出来的两个字段（都是**直接写 float / int，不调用任何游戏代码**）：
;   * 量表 = **`param+0xC0` 的 int 计数器**，上限在 `param+0xC8`（int）。证据：引擎里
;     "补精华量表"的类 AmritaGaugeRecover 用的原语 0x7AF370 就是 `sub+0x10 += n`、
;     由 `sub+0x18` 夹上限，而 sub 正是嵌在 `param+0xB0` 的子对象。**它是 int**——
;     按 float 读是 1e-43 的 denormal，所以前几轮用 float 扫描一直看不到它。
;   * 烧条 = `param+0xCC`（float，0..100）。实测：开九十九瞬间置 100，约 30 秒烧到 0。
;
; 注意：`param+0x48`（看着像量表）与 `param+0x100`（九十九结束后的倒计时）都**不是**
; 量表，前者还会被引擎每帧回写，写它无效。
;
; 1 = 开 / on（默认）   0 = 关 / off
LivingWeaponGaugeOnGuard=1

; 每次精防给量表加多少百分比（0～100，默认 10）。
; Percentage of the gauge added per perfect guard (0-100, default 10).
LivingWeaponGaugePercent=10

; 量表的 int 计数器偏移（十六进制；0 = 关闭写入）。上限默认取"偏移 +8"处的 int。
; Byte offset of the gap gauge's int counter (hex; 0 = disable). The maximum is read from
; the int at offset+8 unless LivingWeaponGaugeMax is non-zero.
LivingWeaponGaugeOffset=0xC0

; 量表上限：**0 = 运行时从"偏移 +8"处的 int 现读**（推荐）；填正数则用它。
; Gauge maximum: 0 = read it from the int at offset+8 at runtime (recommended).
LivingWeaponGaugeMax=0

; **九十九状态中续烧条**开关：1 = 开 / 0 = 关（**v0.1.1 默认关**，见下方说明）。
; Extend the burning bar while the 99 state is active: 1 = on / 0 = off (default in v0.1.1).
; 实测：写入**是生效的**（写 78.42、读回 78.19），但烧条约 15/秒 的速度让它只多烧 ~0.7 秒，
; 肉眼看不出来 —— 因此 v0.1.1 默认关闭，v0.1.2 再把幅度/机制调好。
; Measured: the write DOES stick, but at ~15/s the +10 points only buys ~0.7s, which is
; invisible; parked to v0.1.2.
LivingWeaponExtendOnGuard=0

; 上面那个开关每次精防续多少烧条百分点（0～100，默认 10）。烧条满 100 ≈ 30 秒。
; Percentage points added to the burning bar per perfect guard (0-100, default 10).
LivingWeaponExtendPercent=10
; 注：日志里的 `LW gauge:` 行会写明这次加了多少、当时是否在九十九状态
; （同时打出两路判据的原始读数）、引擎 add() 的返回值与容器检查结果 ——
; 打一场就能确认是否真的生效。

; ── 06 的机制与状态（0.1.1 两轮实机日志结论）/ mechanism+status of section 06 ────
; 第一轮日志证明"往引擎状态容器里塞一个 AmritaGaugeUp 对象"**无效**（add() 成功但量表
; 不动）：那是引擎的**被动修正器**模式，而这个类是一次性效果，需要有人主动调它的 apply，
; 全镜像里没有任何地方这么调。所以那条路已删除。
;
