; ======================================================================
; 仁王 1 · 精准防御 / Nioh 1 · Perfect Guard
; ======================================================================
; 只改等号右边的值，保留参数名；分号开头的行都是说明。
; Edit values after "=" only. Lines beginning with ";" are comments.
;
; 保存为 UTF-8。多数设置支持游戏中保存后自动生效（约 1 秒内）。
; Save as UTF-8. Most settings reload automatically within a second.
;
; 更换 DLL 必须先退出游戏。
; Close the game before replacing the DLL.
;
; 说明：本 MOD 不修改任何游戏代码字节，使用 CPU 硬件断点 +
; 改写线程上下文来实现，因此对完整性校验完全透明。

[PerfectGuard]

; ── 01 · 基本设置 / General ─────────────────────────────────────────────

; MOD 总开关：1 = 开启，0 = 关闭（关闭时不安装任何断点）。
; Master switch: 1 = enabled, 0 = disabled (no breakpoints are armed).
Enabled=1

; 精防窗口（毫秒），范围 1～1000。锚点 A（格挡输入边沿）定位完成后启用。
; Guard window in milliseconds, 1–1000. Active once anchor A is wired up.
WindowMs=250

; 精防后提前接续（取消后摇）：1 = 开启，0 = 关闭（默认关闭）。
; ⚠️ 实验性：实现方式是推进角色动画帧（[[char+0x38]+0x60]，引擎的
; Refer::MotionFrame 读的就是它）。未经实机验证，可能与某些动作冲突。
; 只在当前值看起来确实是动画帧（0 ≤ v < 10000）时才写入，否则跳过。
; Cancel guard recovery by advancing the motion frame. EXPERIMENTAL, not yet
; verified in game; off by default. Only writes when the value already looks
; like a motion frame.
CancelRecovery=0

; 取消后摇时向前推进的帧数，0～1000。越大接续越快。
; Frames to advance. Larger = faster follow-up.
CancelRecoveryFrames=30


; ── 02 · 精防判定 / What counts as a perfect guard ──────────────────────
; RequireTimelyGuard=1 时，只有"在 WindowMs 内新按下过防御键"的成功格挡才算精防。
; 0 = 每次成功格挡都按精防处理（调试/体验用）。
; With 1, only a successful block that happens within WindowMs of a fresh guard
; press counts. 0 = every successful block counts (useful for testing).
RequireTimelyGuard=1

; 防御键位掩码（标准 XInput 位）。默认 0x0100 = XInput 的 LEFT_SHOULDER，
; 即手柄 L1 / LB —— 仁王 PC 版默认防御键。
; 常用值：A=0x1000 B=0x2000 X=0x4000 Y=0x8000，LB=0x0100 RB=0x0200，
;         LT=0x0400 RT=0x0800，BACK=0x0020 START=0x0010。
; 若你改过键位，用 MOD 日志里的 "GUARD pressed (buttons=0x....)" 反查实际掩码。
; Guard button mask, standard XInput bits. Default 0x0100 = LEFT_SHOULDER (L1/LB).
GuardButtonMask=0x0100

; 读取哪个手柄槽位（0～3），单手柄保持 0。
; Which controller slot to read, 0–3. Keep 0 for a single controller.
PadSlot=0

; 【键鼠玩家看这里】键盘防御键的虚拟键码（VK），0 = 不启用。
; 手柄掩码与键盘键是"或"的关系，两个都开着也行。
; 常见 VK：Shift=0x10 Ctrl=0x11 空格=0x20 左Shift=0xA0 右Shift=0xA1
;           鼠标左键=0x01 鼠标右键=0x02 鼠标中键=0x04
; 不知道填什么？把下面的 LearnButtons 设成 1，进游戏按下你的防御键，
; 日志里会出现 "LEARN key VK=0x.. pressed -> GuardKeyVK=.."，把那串数字填到这里。
; Keyboard guard key virtual-key code; 0 = disabled. OR'd with the pad mask.
; Unknown value? Set LearnButtons=1, press your guard key in game, then read the
; "LEARN ..." line from the log.
GuardKeyVK=0

; 按键学习模式：1 = 开启。会在日志里报告"新出现的按键位/键码"，
; 用来在不知道键位时反查 GuardButtonMask / GuardKeyVK。
; 只写日志、不改变任何游戏行为；标定完成后建议改回 0。
; Learn mode: logs every newly seen pad bit and key code so the bindings can be
; determined without guessing. Log only, no gameplay effect. Set back to 0 after.
LearnButtons=0

; 精力字段追踪：1 = 开启（当前默认，处于验证阶段）。
; 同时采样两处字段：数值变化时记一行，另加每约 5 秒一次的慢采样。
;   ki     = [[char+0x240]+0x40]   引擎 Refer::Stamina 读的字段
;   entry7 = [[char+0x240]+0xDEC]  格挡扣精实际改的字段
; 用来确定「格挡耗精减免」是否真的作用在你看得见的精力条上。
; 验证完成后可改回 0 让日志更干净。
; Ki field trace. Logs whenever the entry moves, plus a slow periodic sample:
;   ki     = [[char+0x240]+0x40]   what Refer::Stamina reads
;   entry7 = [[char+0x240]+0xDEC]  what the guard cost subtracts from
; This settles whether the cost reduction affects the visible Ki bar.
KiTrace=1

; 诊断开关，默认 0（全部开启）。用于定位崩溃来自哪一部分：
;   1 = 不装任何断点（此时无法检测任何东西）
;   2 = 不启动输入轮询线程
;   4 = 开启已知会弄崩游戏的“滚动重装”（仅供排查，不要常开）
;   8 = 不跑硬件断点自检
; Diagnostic bitmask; 0 = everything on. Use it to attribute a crash to one part.
DiagDisable=0

; 哪个事件代表“玩家格挡成功”。
;   2 = 自动（默认）：先用扣精点；若它一次都没触发、而旗标点已看到 3 次玩家格挡，则自动切探并在日志里说明。
;   0 = 只用扣精点（最精确，且只有它能缩放扣精量）
;   1 = 只用旗标点（触发条件宽松得多，但拿不到扣精量：
;       KiRecoveryMode 1/2 与“扣精点缩放”在此模式下不生效）
; Which event means the player blocked. 2 = auto (default), 0 = guard-cost site,
; 1 = guard-flag site. See the README for the trade-offs.
BlockEventSource=2




; ── 03 · 格挡耗精 / Guard Ki cost ───────────────────────────────────────
; 格挡耗精减免百分比，范围 0～100。100 = 完全免耗精，50 = 只掉一半。
;
; 实现方式（两条一起用）：
;  1) 在格挡扣精调用处把消耗量按比例缩放；
;  2) 在格挡开始的瞬间快照"可见精力"（[[char+0x240]+0x40]，即引擎
;     Refer::Stamina 读的字段），随后 400 毫秒内把损失按该百分比补回。
;
; 为什么需要第二条：引擎的可见精力来自一张从 +0x40 开始的 16 项表
; （遍历器 0x7B4CB0），而格挡扣精改的是另一张表的 +0xDEC，
; 两者地址不同，所以只缩放消耗量并不足以保证精力条不掉。
; 补回只会"加"，只补到快照值，且只在一个很短的时间窗内生效。
;
; Guard Ki cost reduction, 0–100 (100 = free blocking). Applied two ways, because
; static analysis cannot prove the field the guard-cost anchor writes is the field
; the gauge shows:
;   1. the cost is scaled at the subtraction site (0x74DE51);
;   2. the confirmed Ki field, [[char+0x240]+0x40] -- the one Refer::StaminaRate
;      (0x6EC800) divides by +0x44 to produce a 0..1 ratio for the UI -- is topped
;      back up by this percentage of the loss, over 400 ms after a block.
; The top-up only ever raises Ki, only up to the snapshot, and never exceeds it.
; A KIV log line then reports which of the two mechanisms is actually in effect.
KiDamageReductionPercent=100

; 是否**同时补回**可见精力字段（[[char+0x240]+0x40]）。
; Whether to ALSO top the visible Ki field back up, on top of scaling the cost.
;
;   1 = 补回（默认）。如果缩放锚点够不到精力条，靠这一步才真正省下精力。
;   0 = 不补回，只靠扣精点的缩放。
;       **当日志里的 KIV 行说"缩放已经够到精力条"时，应设成 0** ——
;       否则两条机制都在减，属于重复计算。
;
; 无论取值如何，MOD 都会继续采样并给出 KIV 判定（关掉补回不会失去诊断能力）。
;   1 = top up (default). This is what actually spares Ki when the subtract-site
;       scaling never reaches the bar.
;   0 = never write Ki; rely on the subtract-site scaling alone. Use this when the
;       KIV log line says the scaling already reaches the bar, otherwise the
;       reduction is applied twice.
; Sampling and the KIV verdict continue either way.
KiTopUp=1


; ── 04 · 回精 / Ki recovery ─────────────────────────────────────────────
;   0 = 不回精 / no recovery
;   1 = 返还本次格挡消耗掉的精力（安全、有界）/ refund this guard's cost
;   2 = 固定数值 / add FixedRecovery
;   3 = 回复最大精力的 1/6（默认，与仁王2版 Balanced 一致）
;       restore one sixth of maximum Ki
; 最大精力取自引擎自己的 Refer::Stamina 字段域（[[char+0x240]+0x44]）。
KiRecoveryMode=3

; KiRecoveryMode=2 时使用的固定回精量，范围 0～100000。
; Used only by mode 2: 0–100000.
FixedRecovery=50


; ── 05 · 对敌效果 / Enemy effects ───────────────────────────────────────
; 作用于本次被格挡攻击的"攻击来源"。命中上下文里同时带攻守双方角色指针
; （[ctx+0x100] 与 [ctx+0xE8]），取其中不是玩家的那个作为攻击者。
; Applied to the source of the guarded attack: the hit context carries both
; characters, and the one that is not the player is treated as the attacker.
;
; 数值为固定内部单位，不是百分比。0 = 关闭。
; Fixed internal units, not percentages. 0 = off.

; 削减敌人当前精力（float，[[char+0x240]+0x40]，即 Refer::Stamina 读的字段）。
; Enemy current Ki loss (the same field Refer::Stamina reads).
EnemyKiDamage=0

; 对敌 HP 伤害（整数，[[char+0x240]+0x20]，即 Refer::Hp 读的字段；可致死）。
; Enemy HP damage (the field Refer::Hp reads; can kill).
; 只想削精不想扣血时保持 0。
EnemyHpDamage=0


; ── 06 · 音效 / Sound ───────────────────────────────────────────────────

; 精防提示音：1 = 开启，0 = 关闭。
SoundEnabled=1

; 音量 0～1，允许小数，与游戏音量独立。
SoundVolume=1

; Sounds 目录内的 WAV 文件名，只填文件名不要填路径。
; 支持普通 16 位整数 PCM WAV、44100/48000 Hz、单声道或双声道。
; WAV filename inside Sounds; filename only, no path.
; Standard 16-bit integer PCM WAV, 44100/48000 Hz, mono or stereo.
SoundFile=parry.wav


; ── 07 · 日志 / Logs ────────────────────────────────────────────────────

; 日志快捷键：1 = 开启。游戏在前台时按 Ctrl+Shift+F10 写一行累计统计。
; Log hotkey: with the game foreground, Ctrl+Shift+F10 writes a stats line.
; 日志文件：Nioh1PerfectGuard.gameplay.log（DLL 同目录）。
DiagnosticHotkey=1
